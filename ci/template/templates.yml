# Подключения по SSH
.get_ssh_key:
  stage: deploy
  before_script:
    - 'which ssh-agent'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - touch ~/.ssh/known_hosts
    - chmod 755 ~/.ssh
    - chmod 644 ~/.ssh/known_hosts
    - ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

#Сборка образа и отпрвавка в хрналище артифактов
.build_docker_image:
  stage: build
  image: luminary/docker-dind-ca:26
  variables:
    IMAGE_LATEST: $NEXUS_REGISTRY_DOCKERHOSTED/$CI_PROJECT_TITLE:latest
  before_script:
    - docker login $NEXUS_REGISTRY_DOCKERGROUP -u $NEXUS_AUTH_LOGIN -p $NEXUS_AUTH_PASSWORD
    - docker login $NEXUS_REGISTRY_DOCKERHOSTED -u $NEXUS_AUTH_LOGIN -p $NEXUS_AUTH_PASSWORD
  script:
    - docker build
      -f $DOCKERFILE
      --network=host
      -t $IMAGE_LATEST .
    - docker push $IMAGE_LATEST
    - docker rmi $IMAGE_LATEST
  tags:
    - $RUNNER

# deploy приложения на сервер
.deploy-docker:
  stage: deploy
  variables:
    DOCKER_COMPOSE_PATH: ./docker-compose.yml
  image: luminary/docker-dind-ca:26
  script:
    - unset DOCKER_HOST
    - docker context create context-server-$HOST --docker host=ssh://$USER@$HOST
    - docker context use context-server-$HOST
    - echo "$NEXUS_AUTH_PASSWORD" | docker login "$NEXUS_REGISTRY_DOCKERGROUP" -u "$NEXUS_AUTH_LOGIN" --password-stdin
    # - cat $DOCKER_COMPOSE_PATH  ##  FOR DEBUG
    # - docker ps -a  ##  FOR DEBUG
    # - docker context ls  ##  FOR DEBUG
    - cat "$ENV_FILE_DEV" > $ENV_FILE
    - ls -lah
    - docker compose -f ${DOCKER_COMPOSE_PATH} down || true
    - docker compose -f ${DOCKER_COMPOSE_PATH} pull || true
    - docker compose -f ${DOCKER_COMPOSE_PATH} --env-file $ENV_FILE up -d --force-recreate
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|feature\/.*|bugfix\/.*)$/
      variables:
        ENV_FILE: ${ENV_FILE_DEV}
  tags:
    - $RUNNER

