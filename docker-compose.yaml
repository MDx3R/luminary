x-zitadel-environment: &zitadel-environment
  ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
  ZITADEL_DATABASE_POSTGRES_PORT: 5432
  ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?Set ZITADEL_DB_PASSWORD}
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
  ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
  ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_ADMIN_PASSWORD:?Set ZITADEL_DB_ADMIN_PASSWORD}
  ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
  ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:-zitadel.localhost}
  ZITADEL_EXTERNALPORT: 80
  ZITADEL_EXTERNALSECURE: false
  ZITADEL_TLS_ENABLED: false
  ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?Set a 32-character ZITADEL_MASTERKEY}
  ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
  ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://${ZITADEL_DOMAIN:-zitadel.localhost}/ui/v2/login/
  ZITADEL_OIDC_DEFAULTLOGINURLV2: http://${ZITADEL_DOMAIN:-zitadel.localhost}/ui/v2/login/login?authRequest=
  ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://${ZITADEL_DOMAIN:-zitadel.localhost}/ui/v2/login/logout?post_logout_redirect=
  ZITADEL_SAML_DEFAULTLOGINURLV2: http://${ZITADEL_DOMAIN:-zitadel.localhost}/ui/v2/login/login?samlRequest=
  ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: true

services:
  zitadel-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${ZITADEL_DB_ADMIN_PASSWORD}
    networks:
      - identity
    volumes:
      - zitadel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  zitadel-init:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.16.0}
    command: init
    environment: *zitadel-environment
    networks:
      - identity
    depends_on:
      zitadel-db:
        condition: service_healthy

  zitadel-setup:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.16.0}
    command: setup --masterkeyFromEnv
    user: "0"
    environment:
      <<: *zitadel-environment
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?Set ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: true
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Luminary Login
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_LOGIN_PAT_EXPIRATION:-2027-10-01T00:00:00Z}
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap
    networks:
      - identity
    depends_on:
      zitadel-init:
        condition: service_completed_successfully

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.16.0}
    command: start --masterkeyFromEnv
    environment: *zitadel-environment
    networks:
      - identity
    depends_on:
      zitadel-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION:-v4.16.0}
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_LOGIN_COOKIE_SECRET:?Set ZITADEL_LOGIN_COOKIE_SECRET}
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN:-zitadel.localhost},X-Forwarded-Proto:http
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:ro
    networks:
      - identity
    depends_on:
      zitadel-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs", "http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 5s
      retries: 20

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.0
    command: --config=/etc/oauth2-proxy.cfg
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://${ZITADEL_DOMAIN:-zitadel.localhost}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?Set OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_REDIRECT_URL: ${APP_ORIGIN:-http://localhost}/oauth2/callback
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    networks:
      - identity
    depends_on:
      nginx:
        condition: service_started
      zitadel-api:
        condition: service_healthy

  postgres:
    image: postgres:17
    networks:
      - luminary
    ports:
      - "${DB_HOST_PORT}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    networks:
      - luminary
    ports:
      - "${RABBIT_HOST_PORT}:5672"
      - "${RABBIT_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    networks:
      - luminary
    ports:
      - "${MINIO_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${S3__ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3__SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    networks:
      - luminary
    ports:
      - "${QDRANT_HOST_PORT}:6333"
      - "${QDRANT_GRPC_HOST_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrations
    networks:
      - luminary
    env_file:
      - .env
    # NOTE: environment overrides env_file with proper DB_PORT and DB_HOST
    # regardless of launch env (i.e. local, dev or prod and etc.)
    environment:
      DB_PORT: 5432
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["poetry", "run", "alembic", "upgrade", "head"]

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    networks:
      - luminary
      - identity
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    # NOTE: environment overrides env_file with proper DB_PORT and DB_HOST
    # regardless of launch env (i.e. local, dev or prod and etc.)
    environment:
      DB_PORT: 5432
      DB_HOST: postgres
      RABBIT_HOST: rabbitmq
      S3__ENDPOINT_URL: minio:9000
      QDRANT__ENDPOINT_URL: http://qdrant:6333
      OIDC__USERINFO_URL: http://${ZITADEL_DOMAIN:-zitadel.localhost}/oidc/v1/userinfo
      DEPLOY__EXTERNAL_URL: ${APP_ORIGIN:-http://localhost}

  nginx:
    image: nginx:1.28-alpine
    restart: always
    networks:
      luminary:
      identity:
        aliases:
          - ${ZITADEL_DOMAIN:-zitadel.localhost}
    ports:
      - "127.0.0.1:80:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      ZITADEL_DOMAIN: ${ZITADEL_DOMAIN:-zitadel.localhost}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|APP_ORIGIN|ZITADEL_DOMAIN)$$
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro

networks:
  identity:
    driver: bridge
  luminary:
    driver: bridge
    external: true

volumes:
  zitadel_data:
  zitadel_bootstrap:
  postgres_data:
  minio_data:
  rabbitmq_data:
  qdrant_data:
